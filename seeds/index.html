<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌿 Seed Scanner</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --g:#2D6A4F;--gd:#1A3D2B;--gm:#52B788;--gp:#D8F3DC;--gf:#F0FAF3;
  --cr:#F7F2EA;--cd:#EDE5D8;--ink:#1A1208;--mu:#7A6A58;
  --bo:#DDD4C4;--wh:#FFFFFF;--am:#D4831A;--ap:#FEF3E2;--re:#C0392B;--rp:#FDEDEC;
  --blue:#217346;--blue-pale:#e8f5eb;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--cr);}
#root{min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px;}
.wrap{max-width:680px;margin:0 auto;padding:36px 20px 80px;position:relative;z-index:1;}
.hdr{text-align:center;margin-bottom:36px;}
.hdr-mark{display:inline-block;font-size:2.4rem;margin-bottom:12px;filter:drop-shadow(0 4px 12px rgba(45,106,79,.28));animation:sway 4s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(4deg);}}
.hdr h1{font-family:'Lora',serif;font-size:1.9rem;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.15;}
.hdr h1 em{color:var(--g);font-style:italic;}
.hdr p{margin-top:7px;color:var(--mu);font-size:.87rem;font-weight:300;}
.card{background:var(--wh);border-radius:20px;padding:26px;border:1px solid var(--bo);box-shadow:0 2px 24px rgba(26,18,8,.07);margin-bottom:18px;}
/* Setup */
.setup-banner{background:var(--ap);border:1.5px solid #f0c878;border-radius:14px;padding:20px 22px;margin-bottom:18px;}
.setup-banner h3{font-family:'Lora',serif;font-size:1rem;color:var(--am);margin-bottom:10px;}
.setup-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.setup-lbl{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);}
.setup-inp{padding:10px 13px;font-family:'IBM Plex Mono',monospace;font-size:.88rem;background:var(--wh);border:1.5px solid var(--bo);border-radius:10px;outline:none;color:var(--ink);transition:all .2s;width:100%;}
.setup-inp:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(45,106,79,.1);}
.setup-inp::placeholder{color:#C0B0A0;}
.setup-save{padding:10px 22px;background:var(--g);color:var(--wh);border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:4px;transition:all .2s;}
.setup-save:hover{background:var(--gd);}
/* Status bar */
.statusbar{display:flex;align-items:center;justify-content:space-between;background:var(--wh);border-radius:12px;padding:10px 16px;border:1px solid var(--bo);margin-bottom:18px;flex-wrap:wrap;gap:8px;}
.sb-item{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot-g{background:var(--gm);}
.dot-r{background:#e74c3c;}
.dot-y{background:var(--am);}
.sb-link{font-size:.78rem;color:var(--g);cursor:pointer;font-weight:600;background:none;border:none;font-family:inherit;text-decoration:underline;text-underline-offset:2px;}
.sb-edit{font-size:.75rem;color:var(--mu);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:none;font-family:inherit;}
/* Brands */
.brands-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.bpill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:600;}
.bpill-on{background:var(--gf);border:1.5px solid var(--g);color:var(--g);}
.bpill-off{background:var(--wh);border:1.5px solid var(--bo);color:var(--mu);}
/* Tabs */
.tabs{display:flex;background:var(--cd);border-radius:14px;padding:4px;margin-bottom:18px;gap:4px;}
.tab{flex:1;padding:10px 0;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;color:var(--mu);background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;}
.tab-on{background:var(--wh);color:var(--g);box-shadow:0 2px 12px rgba(45,106,79,.12);}
/* Camera */
.cam-wrap{position:relative;border-radius:14px;overflow:hidden;background:#111;aspect-ratio:4/3;max-height:300px;}
.cam-video{width:100%;height:100%;object-fit:cover;display:block;}
.corners{position:absolute;inset:0;pointer-events:none;}
.c1,.c2,.c3,.c4{position:absolute;width:44px;height:44px;border-color:var(--gm);border-style:solid;}
.c1{top:16px;left:16px;border-width:3px 0 0 3px;border-radius:6px 0 0 0;}
.c2{top:16px;right:16px;border-width:3px 3px 0 0;border-radius:0 6px 0 0;}
.c3{bottom:16px;left:16px;border-width:0 0 3px 3px;border-radius:0 0 0 6px;}
.c4{bottom:16px;right:16px;border-width:0 3px 3px 0;border-radius:0 0 6px 0;}
.scanline{position:absolute;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,var(--gm),transparent);box-shadow:0 0 8px var(--gm);animation:scan 2s ease-in-out infinite;}
@keyframes scan{0%,100%{top:20%;}50%{top:80%;}}
.camstat{position:absolute;bottom:0;left:0;right:0;padding:9px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:rgba(255,255,255,.82);font-size:.77rem;font-weight:500;text-align:center;}
.det-flash{position:absolute;inset:0;background:rgba(82,183,136,.2);display:flex;align-items:center;justify-content:center;animation:fl .3s ease;}
@keyframes fl{0%{background:rgba(82,183,136,.45);}100%{background:rgba(82,183,136,.18);}}
/* Buttons */
.cbtn{width:100%;padding:13px;background:var(--g);color:var(--wh);border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.93rem;font-weight:600;cursor:pointer;transition:all .2s;margin-top:12px;box-shadow:0 4px 14px rgba(45,106,79,.24);display:flex;align-items:center;justify-content:center;gap:7px;}
.cbtn:hover{background:var(--gd);transform:translateY(-1px);}
.cbtn:first-child{margin-top:0;}
.cbtn-stop{background:var(--re);box-shadow:0 4px 14px rgba(192,57,43,.22);}
.cbtn-stop:hover{background:#a93226 !important;transform:none;}
/* Input */
.ilbl{font-size:.71rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:7px;}
.irow{display:flex;gap:8px;}
.inp{flex:1;padding:13px 15px;font-family:'IBM Plex Mono',monospace;font-size:.93rem;letter-spacing:.05em;background:var(--cr);border:2px solid transparent;border-radius:11px;outline:none;color:var(--ink);transition:all .2s;}
.inp:focus{border-color:var(--g);background:var(--wh);box-shadow:0 0 0 4px rgba(45,106,79,.08);}
.inp::placeholder{color:#BBA898;}
.gobtn{padding:13px 20px;background:var(--g);color:var(--wh);border:none;border-radius:11px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:0 4px 14px rgba(45,106,79,.26);}
.gobtn:hover:not(:disabled){background:var(--gd);transform:translateY(-1px);}
.gobtn:disabled{background:#A8C4BA;cursor:not-allowed;box-shadow:none;}
.hint{margin-top:9px;font-size:.77rem;color:#A89880;display:flex;gap:6px;line-height:1.5;}
/* Loading */
.load{text-align:center;padding:40px;}
.spin{width:40px;height:40px;border:3px solid var(--cd);border-top-color:var(--g);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin-sm{width:18px;height:18px;border:2px solid rgba(45,106,79,.2);border-top-color:var(--g);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;}
.load p{font-family:'Lora',serif;font-style:italic;color:var(--mu);}
.load-sub{font-size:.8rem;color:var(--mu);margin-top:6px;opacity:.7;}
/* Result */
.result{animation:up .4s cubic-bezier(.16,1,.3,1);}
@keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.rhdr{border-radius:16px 16px 0 0;padding:22px 24px;background:linear-gradient(135deg,var(--gd) 0%,var(--g) 100%);position:relative;overflow:hidden;}
.rhdr::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);}
.bbadge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:.71rem;font-weight:600;background:rgba(255,255,255,.14);color:rgba(255,255,255,.88);margin-bottom:9px;}
.rname{font-family:'Lora',serif;font-size:1.35rem;font-weight:700;color:var(--wh);line-height:1.2;}
.rsci{font-family:'Lora',serif;font-style:italic;font-size:.84rem;color:rgba(255,255,255,.62);margin-top:3px;}
.rbar{font-family:'IBM Plex Mono',monospace;font-size:.69rem;color:rgba(255,255,255,.4);margin-top:7px;}
.rbody{padding:22px;}
.bnote{border-radius:10px;padding:11px 15px;font-size:.82rem;line-height:1.55;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start;}
.bnote a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;}
/* Seed info grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px;}
.fld{background:var(--cr);border-radius:11px;padding:11px 13px;}
.fld-full{grid-column:1/-1;}
.fl{font-size:.66rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin-bottom:3px;}
.fv{font-size:.87rem;color:var(--ink);line-height:1.4;}
.fv-mono{font-family:'IBM Plex Mono',monospace;font-size:.8rem;}
.conf{display:inline-flex;align-items:center;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;}
.ch{background:var(--gp);color:var(--g);}
.cm{background:var(--ap);color:var(--am);}
.cl{background:var(--rp);color:var(--re);}
/* ── Growing Guide ── */
.guide-wrap{margin-bottom:16px;}
.guide-toggle{width:100%;padding:14px 16px;background:linear-gradient(135deg,#0f3d28,#1a5c3a);color:var(--wh);border:none;border-radius:14px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:all .2s;box-shadow:0 3px 12px rgba(15,61,40,.25);}
.guide-toggle:hover{background:linear-gradient(135deg,#0a2d1e,#145029);}
.guide-toggle-left{display:flex;align-items:center;gap:9px;}
.guide-arrow{font-size:1rem;transition:transform .25s;}
.guide-arrow-open{transform:rotate(180deg);}
.guide-loading{display:flex;align-items:center;gap:8px;font-size:.82rem;color:rgba(255,255,255,.7);}
/* Guide content */
.guide-content{background:var(--wh);border:1px solid var(--bo);border-radius:0 0 14px 14px;border-top:none;overflow:hidden;animation:slideDown .25s ease;}
@keyframes slideDown{from{opacity:0;max-height:0;}to{opacity:1;max-height:2000px;}}
/* Section tabs inside guide */
.guide-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--bo);scrollbar-width:none;}
.guide-tabs::-webkit-scrollbar{display:none;}
.gtab{padding:11px 16px;border:none;background:none;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;gap:5px;}
.gtab:hover{color:var(--ink);}
.gtab-on{color:var(--g);border-bottom-color:var(--g);}
.guide-panel{padding:20px;}
/* Planting calendar */
.months-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px;}
@media(max-width:480px){.months-grid{grid-template-columns:repeat(4,1fr);}}
.month-cell{border-radius:8px;padding:7px 4px;text-align:center;font-size:.72rem;font-weight:600;}
.month-label{display:block;font-size:.65rem;color:var(--mu);margin-bottom:3px;}
.month-dot{width:10px;height:10px;border-radius:50%;margin:0 auto;}
.m-sow-indoor{background:#e8f4e8;color:#2d6a4f;}
.m-sow-direct{background:#d8f3dc;color:#1a3d2b;}
.m-transplant{background:#fdebd0;color:#a0522d;}
.m-harvest{background:#fadbd8;color:#922b21;}
.m-none{background:var(--cr);color:var(--mu);}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--mu);}
.leg-dot{width:10px;height:10px;border-radius:50%;}
/* Pests list */
.pest-list{display:flex;flex-direction:column;gap:10px;}
.pest-item{border-radius:11px;padding:13px 15px;border:1px solid var(--bo);}
.pest-header{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.pest-name{font-size:.9rem;font-weight:600;color:var(--ink);}
.pest-sev{font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:20px;}
.sev-high{background:var(--rp);color:var(--re);}
.sev-med{background:var(--ap);color:var(--am);}
.sev-low{background:var(--gp);color:var(--g);}
.pest-desc{font-size:.83rem;color:var(--mu);line-height:1.5;}
.pest-fix{margin-top:6px;font-size:.8rem;color:var(--g);font-weight:500;}
/* Companions */
.comp-section{margin-bottom:16px;}
.comp-title{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin-bottom:8px;}
.comp-pills{display:flex;flex-wrap:wrap;gap:6px;}
.comp-pill{padding:5px 13px;border-radius:20px;font-size:.82rem;font-weight:500;}
.comp-good{background:var(--gp);color:var(--gd);}
.comp-bad{background:var(--rp);color:var(--re);}
/* Tips */
.tips-list{display:flex;flex-direction:column;gap:10px;}
.tip-item{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;background:var(--cr);border-radius:11px;}
.tip-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px;}
.tip-text{font-size:.86rem;color:var(--ink);line-height:1.55;}
.tip-text strong{color:var(--g);}
/* Watering */
.water-card{background:var(--blue-pale);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;}
.water-icon{font-size:1.6rem;flex-shrink:0;}
.water-detail{font-size:.85rem;color:#1a3d6e;line-height:1.6;}
.water-detail strong{font-weight:600;}
/* Guide loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--cr) 25%,var(--cd) 50%,var(--cr) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.skel-line{height:14px;margin-bottom:10px;}
.skel-line:last-child{width:60%;}
/* Notes, Sheets, divider */
.nlbl{font-size:.71rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:6px;}
.nta{width:100%;padding:11px 13px;background:var(--cr);border:2px solid transparent;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.87rem;color:var(--ink);resize:vertical;min-height:64px;outline:none;transition:all .2s;}
.nta:focus{border-color:var(--g);background:var(--wh);}
.divider{height:1px;background:var(--bo);margin:16px 0;}
.sheets-btn{width:100%;padding:13px;background:var(--blue);color:var(--wh);border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.93rem;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(26,115,232,.28);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
.sheets-btn:hover:not(:disabled){background:#185c38;transform:translateY(-1px);}
.sheets-btn:disabled{background:#A0C8B4;cursor:not-allowed;box-shadow:none;}
.sheets-btn-ok{background:#0f9d58;box-shadow:0 4px 14px rgba(15,157,88,.28);}
.sheets-btn-ok:hover:not(:disabled){background:#0b7a44;}
.gauth{background:var(--gf);border:1.5px solid rgba(45,106,79,.2);border-radius:12px;padding:14px 16px;font-size:.83rem;color:var(--g);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.gauth button{padding:7px 16px;background:var(--g);color:var(--wh);border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.gauth button:hover{background:var(--gd);}
/* Password gate */
.pw-gate{position:fixed;inset:0;background:var(--cr);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
.pw-box{background:var(--wh);border-radius:24px;padding:36px 32px;max-width:360px;width:100%;border:1px solid var(--bo);box-shadow:0 8px 40px rgba(26,18,8,.1);text-align:center;}
.pw-mark{font-size:2.4rem;margin-bottom:14px;filter:drop-shadow(0 4px 12px rgba(45,106,79,.28));animation:sway 4s ease-in-out infinite;}
.pw-title{font-family:'Lora',serif;font-size:1.4rem;font-weight:700;color:var(--ink);margin-bottom:6px;}
.pw-sub{font-size:.84rem;color:var(--mu);margin-bottom:22px;}
.pw-inp{width:100%;padding:13px 15px;font-size:1rem;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;background:var(--cr);border:2px solid transparent;border-radius:12px;outline:none;color:var(--ink);transition:all .2s;text-align:center;}
.pw-inp:focus{border-color:var(--g);background:var(--wh);box-shadow:0 0 0 4px rgba(45,106,79,.08);}
.pw-btn{width:100%;margin-top:12px;padding:13px;background:var(--g);color:var(--wh);border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(45,106,79,.24);}
.pw-btn:hover:not(:disabled){background:var(--gd);}
.pw-btn:disabled{background:#A8C4BA;cursor:not-allowed;box-shadow:none;}
.pw-err{margin-top:10px;font-size:.83rem;color:var(--re);font-weight:500;}
/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:12px;font-size:.88rem;font-weight:600;color:var(--wh);z-index:100;animation:toastIn .3s ease;box-shadow:0 6px 24px rgba(0,0,0,.18);white-space:nowrap;}
.toast-ok{background:var(--gm);}
.toast-err{background:var(--re);}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
/* Error */
.errc{background:var(--rp);border:1.5px solid #f5b0a8;border-radius:20px;padding:26px;text-align:center;animation:up .3s ease;}
.erri{font-size:1.9rem;margin-bottom:9px;}
.errt{font-family:'Lora',serif;font-size:1.03rem;color:var(--re);margin-bottom:7px;}
.errm{font-size:.84rem;color:var(--mu);line-height:1.6;}
/* History */
.htitle{font-size:.71rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:9px;display:flex;align-items:center;gap:8px;}
.htitle::after{content:'';flex:1;height:1px;background:var(--bo);}
.hi{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:var(--wh);border-radius:11px;border:1px solid var(--bo);margin-bottom:7px;cursor:pointer;transition:all .15s;}
.hi:hover{border-color:var(--g);background:var(--gf);}
.hn{font-size:.87rem;font-weight:600;color:var(--ink);}
.hs{font-family:'IBM Plex Mono',monospace;font-size:.71rem;color:var(--mu);margin-top:2px;}
.hi-saved{color:var(--gm);font-size:.78rem;font-weight:600;}
.nosup{background:var(--ap);border:1.5px solid #f0c060;border-radius:11px;padding:14px 16px;font-size:.83rem;color:#7a5a10;line-height:1.6;margin-bottom:12px;}
@media(max-width:480px){.grid{grid-template-columns:1fr;}.fld-full{grid-column:1;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isPwAuthValid(){

}

/* ── API call ── */
async function claudeCall(system, userMsg, apiKey, maxTokens=1000){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTokens,
      system,messages:[{role:'user',content:userMsg}]})
  });
  const data=await res.json();
  if(data.error) throw new Error(data.error.message);
  const raw=data.content?.find(b=>b.type==='text')?.text||'{}';
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}

let _msalInstance=null;
function getMSALInstance(){
  if(_msalInstance) return _msalInstance;
  const clientId=localStorage.getItem(LS.MS_CLIENT);
  if(!clientId) return null;
  _msalInstance=new msal.PublicClientApplication({
    auth:{clientId,authority:'https://login.microsoftonline.com/consumers',
      redirectUri:'https://login.microsoftonline.com/common/oauth2/nativeclient'},
    cache:{cacheLocation:'localStorage',storeAuthStateInCookie:false}
  });
  return _msalInstance;
}
const MS_SCOPES=['https://graph.microsoft.com/Files.ReadWrite','User.Read'];

async function getMSToken(){
  const inst=getMSALInstance();
  if(!inst) throw new Error('Azure App Client ID not configured. Open Settings.');
  const accounts=inst.getAllAccounts();
  if(accounts.length>0){
    try{const r=await inst.acquireTokenSilent({scopes:MS_SCOPES,account:accounts[0]});return r.accessToken;}
    catch(_){}
  }
  const r=await inst.loginPopup({scopes:MS_SCOPES});
  return r.accessToken;
}

async function excelAppend(token,filePath,values){
  const enc=encodeURIComponent(filePath);
  const base=`https://graph.microsoft.com/v1.0/me/drive/root:${enc}:/workbook/worksheets/Seed Inventory`;
  // find next empty row
  const rr=await fetch(`${base}/usedRange?$select=rowCount`,
    {headers:{Authorization:`Bearer ${token}`}});
  if(!rr.ok){const e=await rr.json();throw new Error(e.error?.message||'Could not read Excel file');}
  const rd=await rr.json();
  const nextRow=(rd.rowCount||1)+1;
  const endCol=String.fromCharCode(64+values.length);
  const wr=await fetch(`${base}/range(address='A${nextRow}:${endCol}${nextRow}')`,{
    method:'PATCH',
    headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify({values:[values]})
  });
  if(!wr.ok){const e=await wr.json();throw new Error(e.error?.message||'Excel write failed');}
  return wr.json();
}

/* ── Password Gate ── */
function PwGate({onAuth}){
  const [pw,setPw]=useState('');
  const [err,setErr]=useState(false);
  const [busy,setBusy]=useState(false);

  const check=async()=>{
    if(!pw.trim()) return;
    setBusy(true);setErr(false);
    const stored=localStorage.getItem(LS.PW_HASH);
    const entered=await hashPw(pw);
    if(entered===stored){setPwAuth();onAuth();}
    else{setErr(true);setBusy(false);}
  };

  return(
    <div className="pw-gate">
      <div className="pw-box">
        <div className="pw-mark">🌿</div>
        <div className="pw-title">Seed Scanner</div>
        <div className="pw-sub">Enter your password to continue</div>
        <input className="pw-inp" type="password" placeholder="••••••••"
          value={pw} onChange={e=>{setPw(e.target.value);setErr(false);}}
          onKeyDown={e=>e.key==='Enter'&&check()} autoFocus/>
        <button className="pw-btn" onClick={check} disabled={!pw.trim()||busy}>
          {busy?'Checking…':'Unlock →'}
        </button>
        {err&&<div className="pw-err">Incorrect password — try again.</div>}
      </div>
    </div>
  );
}

/* ── Toast ── */
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t);},[onDone]);
  return <div className={`toast toast-${type}`}>{msg}</div>;
}

function App(){
  const [tab,setTab]=useState('camera');
  const [manual,setManual]=useState('');
  const [status,setStatus]=useState('idle');
  const [result,setResult]=useState(null);
  const [guide,setGuide]=useState(null);
  const [guideLoading,setGuideLoading]=useState(false);
  const [errMsg,setErrMsg]=useState('');
  const [notes,setNotes]=useState('');
  const [history,setHistory]=useState([]);
  const [camState,setCamState]=useState('idle');
  const [detCode,setDetCode]=useState('');
  const [msConnected,setMsConnected]=useState(()=>{
    const inst=getMSALInstance();
    return !!(inst&&inst.getAllAccounts().length>0);
  });
  const [sheetsSaving,setSheetsSaving]=useState(false);
  const [sheetsSaved,setSheetsSaved]=useState(false);
  const [toast,setToast]=useState(null);
  const [setupDone,setSetupDone]=useState(
    !!(localStorage.getItem(LS.KEY)&&localStorage.getItem(LS.MS_CLIENT)&&localStorage.getItem(LS.EXCEL_FILE))
  );
  const [showSettings,setShowSettings]=useState(false);

  const videoRef=useRef(null);
  const streamRef=useRef(null);
  const detectorRef=useRef(null);
  const rafRef=useRef(null);
  const processing=useRef(false);

  const showToast=(msg,type='ok')=>setToast({msg,type});

  /* Microsoft / Excel auth */
  const authorizeMS=async()=>{
    try{
      await getMSToken();
      setMsConnected(true);
      showToast('✓ Connected to Microsoft Excel','ok');
    }catch(err){
      showToast(`Sign-in failed: ${err.message}`,'err');
    }
  };

  /* Camera */
  const stopCam=useCallback(()=>{
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}
    if(videoRef.current)videoRef.current.srcObject=null;
    setCamState('idle');processing.current=false;
  },[]);
  useEffect(()=>()=>stopCam(),[stopCam]);

  const startCam=async()=>{
    if(!('BarcodeDetector' in window)){setCamState('nosupport');return;}
    try{
      detectorRef.current=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
      streamRef.current=stream;
      if(videoRef.current){videoRef.current.srcObject=stream;await videoRef.current.play();}
      setCamState('active');
      const loop=async()=>{
        if(!videoRef.current||!detectorRef.current||processing.current)return;
        try{
          const codes=await detectorRef.current.detect(videoRef.current);
          if(codes.length&&!processing.current){
            processing.current=true;const code=codes[0].rawValue;
            setDetCode(code);setCamState('detected');stopCam();await runLookup(code);return;
          }
        }catch(_){}
        rafRef.current=requestAnimationFrame(loop);
      };
      rafRef.current=requestAnimationFrame(loop);
    }catch(_){setCamState('idle');setErrMsg('Camera access denied.');setStatus('error');}
  };

  /* ── Core lookup — runs TWO parallel AI calls ── */
  const runLookup=async(code)=>{
    const apiKey=localStorage.getItem(LS.KEY);
    if(!apiKey){showToast('Anthropic API key not set. Open settings.','err');setStatus('idle');return;}
    setStatus('loading');setResult(null);setGuide(null);setErrMsg('');setNotes('');setSheetsSaved(false);
    try{
      // UPC lookup
      let productName='',brandStr='';
      try{
        const r=await fetch(`https://api.upcitemdb.com/prod/trial/lookup?upc=${code}`);
        const d=await r.json();
        if(d.items?.length){productName=d.items[0].title||'';brandStr=d.items[0].brand||'';}
      }catch(_){}

      const brandMeta=detectBrand(productName)||detectBrand(brandStr);
      const idPrompt=productName
        ?`Barcode: ${code}\nProduct: "${productName}"${brandStr?` by ${brandStr}`:''}\n\nExtract seed information.`
        :`Barcode: ${code}\nNo UPC match. Provide best-guess info.`;

      // Call 1: identification (awaited — needed before we can render result)
      const parsed=await claudeCall(ID_SYSTEM(brandMeta),idPrompt,apiKey,800);
      const n=String(Math.floor(Math.random()*900)+100).padStart(3,'0');
      const entry={...parsed,barcode:code,seedId:`SD-${n}`,
        acquiredDate:new Date().toISOString().split('T')[0],brandMeta:brandMeta||null,savedToSheets:false};
      setResult(entry);setStatus('result');
      setHistory(prev=>[entry,...prev.filter(h=>h.barcode!==code)].slice(0,8));

      // Call 2: growing guide (fires immediately after, non-blocking)
      setGuideLoading(true);
      try{
        const guideData=await claudeCall(GUIDE_SYSTEM,
          `Plant: ${parsed.commonName}${parsed.scientificName?` (${parsed.scientificName})`:''}${parsed.seedType?`, ${parsed.seedType} variety`:''}`,
          apiKey,2000);
        setGuide(guideData);
      }catch(_){setGuide(null);}
      finally{setGuideLoading(false);}
    }catch(err){
      setStatus('error');setErrMsg(err.message||'Lookup failed.');
    }
  };

  /* Save to Excel */
  const saveToExcel=async()=>{
    const filePath=localStorage.getItem(LS.EXCEL_FILE);
    if(!filePath){showToast('Excel file path not configured.','err');return;}
    setSheetsSaving(true);
    try{
      const token=await getMSToken();
      setMsConnected(true);
      await excelAppend(token,filePath,toExcelRow(result,notes));
      setSheetsSaved(true);
      setHistory(prev=>prev.map(h=>h.barcode===result.barcode?{...h,savedToSheets:true}:h));
      showToast('✓ Saved to Excel!','ok');
    }catch(err){
      showToast(`Excel error: ${err.message}`,'err');
    }finally{setSheetsSaving(false);}
  };

  const cc=c=>c==='high'?'ch':c==='medium'?'cm':'cl';
  const cl=c=>c==='high'?'✓ High':c==='medium'?'~ Medium':'? Low';
  const reset=()=>{setStatus('idle');setResult(null);setGuide(null);setManual('');setDetCode('');setSheetsSaved(false);};
  const showPanel=status!=='result'&&status!=='error'&&status!=='loading';

  if(!setupDone||showSettings){
    return(
      <div className="wrap">
        <div className="hdr">
          <div className="hdr-mark">🌿</div>
          <h1>Seed <em>Scanner</em></h1>
          <p>One-time setup — takes about 5 minutes</p>
        </div>
        <SetupPanel onSave={()=>{setSetupDone(true);setShowSettings(false);}}/>
      </div>
    );
  }

  return(
    <div className="wrap">
      <div className="hdr">
        <div className="hdr-mark">🌿</div>
        <h1>Seed <em>Scanner</em></h1>
        <p>Scan · Identify · Get AI growing advice · Save to Excel</p>
      </div>

      {/* Status bar */}
      <div className="statusbar">
        <div className="sb-item">
          <span className={`dot ${localStorage.getItem(LS.KEY)?'dot-g':'dot-r'}`}/>
          <span>Anthropic API</span>
        </div>
        <div className="sb-item">
          <span className={`dot ${msConnected?'dot-g':'dot-y'}`}/>
          <span>{msConnected?'Excel connected':'Excel'}</span>
          {!msConnected&&<button className="sb-link" onClick={authorizeMS}>Connect →</button>}
        </div>
        <button className="sb-edit" onClick={()=>setShowSettings(true)}>⚙ Settings</button>
      </div>

      {/* Brands */}
      <div className="brands-bar">
        <span style={{fontSize:'.77rem',color:'var(--mu)',fontWeight:600,alignSelf:'center'}}>Optimized for:</span>
        {[{label:'Botanical Interests',logo:'🌸'},{label:"Johnny's Selected Seeds",logo:'🌾'}].map(b=>(
          <span key={b.label} className="bpill bpill-on">{b.logo} {b.label}</span>
        ))}
        <span className="bpill bpill-off">+ any UPC packet</span>
      </div>

      {/* Tabs */}
      <div className="tabs">
        <button className={`tab ${tab==='camera'?'tab-on':''}`}
          onClick={()=>{setTab('camera');if(status!=='loading'){reset();stopCam();}}}>
          📷 Camera Scan
        </button>
        <button className={`tab ${tab==='manual'?'tab-on':''}`}
          onClick={()=>{setTab('manual');if(status!=='loading')stopCam();}}>
          ⌨️ Enter Barcode
        </button>
      </div>

      {/* Camera panel */}
      {tab==='camera'&&showPanel&&(
        <div className="card">
          {camState==='nosupport'&&(
            <div className="nosup">⚠️ <strong>Camera scanning needs Chrome or Edge.</strong> Use the Enter Barcode tab instead, or try on Android Chrome.</div>
          )}
          {(camState==='idle'||camState==='nosupport')&&(
            <button className="cbtn" onClick={startCam}>📷 Start Camera</button>
          )}
          {(camState==='active'||camState==='detected')&&(
            <>
              <div className="cam-wrap">
                <video ref={videoRef} className="cam-video" playsInline muted/>
                <div className="corners"><span className="c1"/><span className="c2"/><span className="c3"/><span className="c4"/></div>
                {camState==='active'&&<div className="scanline"/>}
                {camState==='detected'&&<div className="det-flash"><span style={{fontSize:'2rem'}}>✅</span></div>}
                <div className="camstat">{camState==='active'?'Point at a seed packet barcode…':`Detected: ${detCode}`}</div>
              </div>
              <button className="cbtn cbtn-stop" style={{marginTop:12}} onClick={stopCam}>✕ Stop Camera</button>
            </>
          )}
        </div>
      )}

      {/* Manual panel */}
      {tab==='manual'&&showPanel&&(
        <div className="card">
          <div className="ilbl">Barcode Number</div>
          <div className="irow">
            <input className="inp" type="text" placeholder="e.g. 093624316800"
              value={manual} onChange={e=>setManual(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&manual.trim()&&runLookup(manual.trim())} maxLength={20}/>
            <button className="gobtn" onClick={()=>runLookup(manual.trim())} disabled={!manual.trim()}>Look Up →</button>
          </div>
          <div className="hint">💡 The barcode number is printed in small digits below the black lines on the packet.</div>
        </div>
      )}

      {/* Loading */}
      {status==='loading'&&(
        <div className="card load">
          <div className="spin"/>
          <p>Identifying seed…</p>
          <div className="load-sub">Fetching growing guide in parallel</div>
        </div>
      )}

      {/* Error */}
      {status==='error'&&(
        <div className="errc">
          <div className="erri">🍂</div>
          <div className="errt">Couldn't identify this barcode</div>
          <div className="errm">{errMsg}</div>
          <button className="cbtn" style={{marginTop:18,maxWidth:220,margin:'18px auto 0'}} onClick={reset}>← Try Again</button>
        </div>
      )}

      {/* Result */}
      {status==='result'&&result&&(
        <div className="result card" style={{padding:0,overflow:'hidden'}}>
          <div className="rhdr">
            {result.brandMeta&&<div className="bbadge">{result.brandMeta.logo} {result.brandMeta.label}</div>}
            <div className="rname">{result.commonName}</div>
            {result.scientificName&&<div className="rsci">{result.scientificName}</div>}
            <div className="rbar">▌ {result.barcode}</div>
          </div>
          <div className="rbody">
            {result.brandMeta&&(
              <div className="bnote" style={{background:result.brandMeta.accent,color:result.brandMeta.color}}>
                <span style={{fontSize:'1.1rem'}}>{result.brandMeta.logo}</span>
                <div>{result.brandMeta.note}{' '}
                  <a href={result.brandMeta.url(result.commonName)} target="_blank" rel="noreferrer">
                    Search {result.brandMeta.label} →
                  </a>
                </div>
              </div>
            )}

            {/* Seed data grid */}
            <div className="grid">
              {[['Seed Type',result.seedType],['Origin',result.originRegion],
                ['Days to Germinate',result.daysToGerminate],['Days to Maturity',result.daysToMaturity],
                ['Germ. Temp',result.germinationTemp],['Sunlight',result.sunlight],
                ['Sow Depth',result.sowingDepth],['Spacing',result.spacing],
                ['Difficulty',result.growingDifficulty],['Seed Viability',result.yearsViable],
                ['Storage',result.storageConditions,'full'],
                ['Germination Tip',result.germinationNotes,'full'],
                ...(result.culinaryUses?[['Culinary Uses',result.culinaryUses,'full']]:[]),
                ...(result.seedSavingNotes?[['Seed Saving',result.seedSavingNotes,'full']]:[]),
                ...(result.notes?[['Notes',result.notes,'full']]:[]),
              ].map(([l,v,f])=>(
                <div key={l} className={`fld${f?' fld-full':''}`}>
                  <div className="fl">{l}</div><div className="fv">{v||'—'}</div>
                </div>
              ))}
              <div className="fld"><div className="fl">Seed ID</div><div className="fv fv-mono">{result.seedId}</div></div>
              <div className="fld"><div className="fl">Confidence</div>
                <div className="fv"><span className={`conf ${cc(result.confidence)}`}>{cl(result.confidence)}</span></div>
              </div>
            </div>

            {/* ── Growing Guide ── */}
            <GrowingGuide guide={guide} loading={guideLoading}/>

            {/* Notes */}
            <div className="nlbl">Your Notes</div>
            <textarea className="nta" placeholder="Personal observations, where you bought it…"
              value={notes} onChange={e=>setNotes(e.target.value)}/>

            <div className="divider"/>

            {/* Excel */}
            {!msConnected?(
              <div className="gauth">
                <span>Connect Microsoft Excel to save this seed to your inventory.</span>
                <button onClick={authorizeMS}>Sign in →</button>
              </div>
            ):(
              <button className={`sheets-btn${sheetsSaved?' sheets-btn-ok':''}`}
                onClick={saveToExcel} disabled={sheetsSaving||sheetsSaved}>
                {sheetsSaving?'Saving…':sheetsSaved?'✓ Saved to Excel!':'📗 Save to Excel'}
              </button>
            )}
            <button className="cbtn" onClick={reset}>← Scan Another Seed</button>
          </div>
        </div>
      )}

      {/* History */}
      {history.length>0&&status!=='loading'&&(
        <div style={{marginTop:28}}>
          <div className="htitle">Session History</div>
          {history.map((h,i)=>(
            <div key={i} className="hi"
              onClick={()=>{setResult(h);setStatus('result');setNotes('');setDetCode(h.barcode);setSheetsSaved(h.savedToSheets||false);setGuide(null);setGuideLoading(false);}}>
              <div>
                <div className="hn">{h.brandMeta?.logo||'🌱'} {h.commonName}</div>
                <div className="hs">{h.barcode} · {h.seedType||'Unknown'}</div>
              </div>
              {h.savedToSheets&&<span className="hi-saved">✓ Saved</span>}
            </div>
          ))}
        </div>
      )}

      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </div>
  );
}

function Root(){
  const hasPw=!!localStorage.getItem(LS.PW_HASH);
  const [authed,setAuthed]=React.useState(!hasPw||isPwAuthValid());
  if(!authed) return <PwGate onAuth={()=>setAuthed(true)}/>;
  return <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
